services:
  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:latest
    restart: always
    volumes:
    - /dev/net/tun:/dev/net/tun
    - ./lib/tailscale:/var/lib/tailscale
    environment:
    - TS_AUTH_KEY=${TS_AUTHKEY}
    - TS_ROUTES=192.168.1.0/24
    - TS_HOSTNAME=caixinha
    - TS_STATE_DIR=/var/lib/tailscale
    - TS_ACCEPT_DNS=true
    # Defaults to true in this image otherwise -- without a real kernel TUN
    # device, tailscaled runs its own userspace netstack instead, so the
    # tailscale IP never becomes a real host-level address. That's fine for
    # tailscaled's own traffic (subnet routing to the LAN already worked
    # this whole time), but it silently breaks anything else that needs to
    # bind directly to the tailscale IP -- e.g. dns-relay below.
    - TS_USERSPACE=false
    network_mode: host
    privileged: true

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    pull_policy: always
    # UGOS's own host-level resolver already holds port 53 (confirmed via
    # `netstat` in the tailscale container's console — 0.0.0.0:53 and
    # 127.0.0.1:53 were both taken), so network_mode: host/service:tailscale
    # can't work here. Pi-hole instead gets its own real LAN IP via the
    # macvlan network below (see the top-level `networks:` block) — that
    # sidesteps the host's port 53 entirely.
    networks:
      lan_macvlan:
        ipv4_address: 192.168.1.254
      dns_relay:
        ipv4_address: 172.21.0.2
    cap_add:
    - NET_ADMIN
    - SYS_TIME
    - SYS_NICE
    volumes:
    - ./etc-pihole:/etc/pihole
    environment:
    - TZ=Europe/Lisbon
    - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD}
    # Without this, Pi-hole only answers queries arriving on an
    # interface/subnet it recognizes as "local" — Tailscale clients on the
    # 100.64.0.0/10 CGNAT range get silently dropped otherwise.
    - FTLCONF_dns_listeningMode=ALL
    restart: unless-stopped

  dns-relay:
    container_name: dns-relay
    image: tschaffter/dnsmasq:latest
    pull_policy: always
    # Bridges the macvlan gap: this runs on network_mode: host so it can
    # bind the NAS's tailscale IP directly, then forwards to Pi-hole over
    # the dns_relay bridge network (which, unlike macvlan, the host can
    # reach normally). See dns-relay/dnsmasq.conf for the actual config.
    network_mode: host
    depends_on:
    - tailscale
    - pihole
    cap_add:
    - NET_BIND_SERVICE
    volumes:
    - ./dns-relay/dnsmasq.conf:/etc/dnsmasq.conf:ro
    # Bypasses this image's own docker-entrypoint.sh, which appeared to
    # drop privileges internally (su-exec/gosu to a non-root user) even
    # after cap_add: NET_BIND_SERVICE -- calling dnsmasq directly runs it
    # as whatever UID Docker itself starts the container with (root).
    entrypoint: ["dnsmasq"]
    command: ["-k"]
    restart: unless-stopped

networks:
  lan_macvlan:
    driver: macvlan
    driver_opts:
      # Real kernel interface name behind UGOS's "VBR-LAN1" label — found by
      # running `ip -br addr` inside the tailscale container's console
      # (it's on network_mode: host, so it sees the host's real interfaces).
      parent: bridge0
    ipam:
      config:
      - subnet: 192.168.1.0/24
        gateway: 192.168.1.1
    # NOTE: standard Docker macvlan limitation — the NAS host itself (and
    # anything else on network_mode: host, e.g. the tailscale container)
    # cannot reach 192.168.1.254 directly. Other LAN devices can. Tailnet
    # clients couldn't either (confirmed: "destination host unreachable"
    # via the subnet route in TS_ROUTES above) — the dns-relay service +
    # dns_relay network below work around that, confirmed working: point
    # Tailscale's admin console DNS nameserver at 100.66.227.104 (not
    # 192.168.1.254) to use Pi-hole tailnet-wide.
  dns_relay:
    driver: bridge
    ipam:
      config:
      - subnet: 172.21.0.0/24
