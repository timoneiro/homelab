# Pure relay: forward everything to Pi-hole, don't resolve or cache locally.
no-resolv
no-hosts
server=172.21.0.2

# Only bind the tailnet IP -- UGOS's own resolver already holds 0.0.0.0:53
# and 127.0.0.1:53 on the host (that's why Pi-hole itself needed a macvlan
# IP in the first place). Binding a specific, different address avoids
# re-triggering that same conflict.
listen-address=100.66.227.104
bind-interfaces

log-queries
