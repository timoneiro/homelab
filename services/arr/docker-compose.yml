services:
############################################
# 🚀 PROWLARR: Usenet Indexing & Search 🚀
############################################
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    volumes:
      - /volume2/docker/arr/prowlarr/config:/config
      - /volume2/docker/arr/prowlarr/backup:/backup
      - /volume1/jellyfin/Downloads:/downloads
    environment:
      - PUID=1000
      - PGID=10
    ports:
      - 9696:9696
    restart: unless-stopped

################################################
# 📺 SONARR: TV Show Automation & Management 📺
################################################
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    volumes:
      - /volume2/docker/arr/sonarr/config:/config
      - /volume2/docker/arr/sonarr/backup:/data/Backup
      - /volume1/jellyfin/TV Shows:/data/tvshows
      - /volume1/jellyfin/Downloads:/downloads
    environment:
      - PUID=1000
      - PGID=10
    ports:
      - 8989:8989
    restart: unless-stopped

############################################
# 🎬 RADARR: Movie Management & Download 🎬
############################################
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    volumes:
      - /volume2/docker/arr/radarr/config:/config
      - /volume1/jellyfin/Movies:/data/movies
      - /volume2/docker/arr/radarr/backup:/data/Backup
      - /volume1/jellyfin/Downloads:/downloads
    ports:
      - 7878:7878
    environment:
      - PUID=1000
      - PGID=10
    restart: unless-stopped

####################################################
# ⚡ qBITTORRENT: Fast & Powerful Torrent Client ⚡
####################################################
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    hostname: qbittorrent
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - /volume2/docker/arr/qbittorrent/config:/config
      - /volume1/jellyfin/Downloads:/downloads
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    environment:
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
      - EULA=accept
      - PUID=1000
      - PGID=10
    healthcheck:
      start_period: 15s

####################################################
# 🎬 BAZARR: Subtitle Management & Sync for Plex 🎬
####################################################
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    volumes:
      - /volume2/docker/arr/bazarr/config:/config
      - /volume1/jellyfin/Movies:/data/movies
      - /volume1/jellyfin/TV Shows:/data/tvshows
    ports:
      - 6767:6767
    environment:
      - PUID=1000
      - PGID=10
    restart: unless-stopped
####################################################
# 🎬 SEERR: Request Management (Jellyseerr's successor) 🎬
####################################################
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    pull_policy: always
    init: true
    environment:
      - TZ=Europe/Lisbon
    ports:
      - 5055:5055
    volumes:
      - /volume2/docker/arr/jellyseerr/config:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
####################################################
# ⚡ Unpackerr: Unpack rar files ⚡
####################################################
  unpackerr:
    image: golift/unpackerr
    container_name: unpackerr
    volumes:
      - /volume1/jellyfin/Downloads:/downloads
    restart: always
    user: 1000:100
    # ie. Remove all lines that begin with UN_CMDHOOK, UN_WEBHOOK,
    #     UN_FOLDER, UN_WEBSERVER, and other apps you do not use.
    environment:
    - TZ=Europe/Lisbon
    ## Global Settings
    - UN_DEBUG=false
    - UN_QUIET=false
    - UN_ERROR_STDERR=false
    - UN_ACTIVITY=false
    - UN_LOG_QUEUES=1m
    - UN_LOG_FILE=/downloads/unpackerr.log
    - UN_LOG_FILES=10
    - UN_LOG_FILE_MB=10
    - UN_LOG_FILE_MODE=0600
    - UN_INTERVAL=2m
    - UN_START_DELAY=1m
    - UN_RETRY_DELAY=5m
    - UN_MAX_RETRIES=3
    - UN_PARALLEL=1
    - UN_FILE_MODE=0644
    - UN_DIR_MODE=0755
    ## Web Server
    - UN_WEBSERVER_METRICS=false
    - UN_WEBSERVER_LISTEN_ADDR=0.0.0.0:5656
    - UN_WEBSERVER_LOG_FILE=
    - UN_WEBSERVER_LOG_FILES=10
    - UN_WEBSERVER_LOG_FILE_MB=10
    - UN_WEBSERVER_SSL_CERT_FILE=
    - UN_WEBSERVER_SSL_KEY_FILE=
    - UN_WEBSERVER_URLBASE=/
    - UN_WEBSERVER_UPSTREAMS=
    ## Folder Settings
    - UN_FOLDERS_INTERVAL=1s
    - UN_FOLDERS_BUFFER=20000
    ## Sonarr Settings
    - UN_SONARR_0_URL=http://sonarr:8989
    - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
    - UN_SONARR_0_PATHS_0=/downloads
    - UN_SONARR_0_PROTOCOLS=torrent
    - UN_SONARR_0_TIMEOUT=10s
    - UN_SONARR_0_DELETE_DELAY=5m
    - UN_SONARR_0_DELETE_ORIG=false
    - UN_SONARR_0_SYNCTHING=false
    ## Radarr Settings
    - UN_RADARR_0_URL=http://radarr:7878
    - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
    - UN_RADARR_0_PATHS_0=/downloads
    - UN_RADARR_0_PROTOCOLS=torrent
    - UN_RADARR_0_TIMEOUT=10s
    - UN_RADARR_0_DELETE_DELAY=5m
    - UN_RADARR_0_DELETE_ORIG=false
    - UN_RADARR_0_SYNCTHING=false
    ## Watch Folders
    - UN_FOLDER_0_PATH=/downloads/auto_extract
    - UN_FOLDER_0_EXTRACT_PATH=
    - UN_FOLDER_0_DELETE_AFTER=10m
    - UN_FOLDER_0_DISABLE_RECURSION=false
    - UN_FOLDER_0_DELETE_FILES=false
    - UN_FOLDER_0_DELETE_ORIGINAL=false
    - UN_FOLDER_0_DISABLE_LOG=false
    - UN_FOLDER_0_MOVE_BACK=false
    - UN_FOLDER_0_EXTRACT_ISOS=false
    ## Web Hooks
    - UN_WEBHOOK_0_URL=https://notifiarr.com/api/v1/notification/unpackerr/api_key_from_notifiarr_com
    - UN_WEBHOOK_0_NAME=
    - UN_WEBHOOK_0_SILENT=false
    - UN_WEBHOOK_0_EVENTS_0=1
    - UN_WEBHOOK_0_EVENTS_1=4
    - UN_WEBHOOK_0_EVENTS_2=6
    - UN_WEBHOOK_0_NICKNAME=Unpackerr
    - UN_WEBHOOK_0_CHANNEL=
    - UN_WEBHOOK_0_EXCLUDE_0=readarr
    - UN_WEBHOOK_0_EXCLUDE_1=lidarr
    - UN_WEBHOOK_0_TEMPLATE_PATH=
    - UN_WEBHOOK_0_TEMPLATE=
    - UN_WEBHOOK_0_IGNORE_SSL=false
    - UN_WEBHOOK_0_TIMEOUT=10s
    - UN_WEBHOOK_0_CONTENT_TYPE=application/json
    ## Command Hooks
    - UN_CMDHOOK_0_COMMAND=/downloads/scripts/command.sh
    - UN_CMDHOOK_0_NAME=
    - UN_CMDHOOK_0_SHELL=false
    - UN_CMDHOOK_0_SILENT=false
    - UN_CMDHOOK_0_EVENTS_0=1
    - UN_CMDHOOK_0_EVENTS_1=4
    - UN_CMDHOOK_0_EVENTS_2=7
    - UN_CMDHOOK_0_EXCLUDE_0=readarr
    - UN_CMDHOOK_0_EXCLUDE_1=lidarr
    - UN_CMDHOOK_0_TIMEOUT=10s
