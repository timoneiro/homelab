# Mosquitto 2 only listens on localhost inside the container unless a
# listener is declared. The compose file publishes this port on the NAS's
# loopback only, so nothing on the LAN reaches it.
listener 1883
allow_anonymous false
# Generated from .env on every start, see the compose file's `command:`.
password_file /mosquitto/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
